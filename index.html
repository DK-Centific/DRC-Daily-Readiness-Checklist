<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Readiness Checklist</title>
  <script>
    (function () {
      var choice = 'system';
      try {
        var stored = localStorage.getItem('drc_theme');
        if (!stored) {
          var legacy = localStorage.getItem('drc.theme');
          if (legacy === 'light' || legacy === 'dark' || legacy === 'system') {
            stored = legacy;
            localStorage.setItem('drc_theme', legacy);
          }
        }
        if (stored === 'light' || stored === 'dark' || stored === 'system') choice = stored;
      } catch (e) {}
      if (choice === 'light' || choice === 'dark') {
        document.documentElement.setAttribute('data-theme', choice);
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      document.documentElement.setAttribute('data-theme-choice', choice);
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="256x256" href="assets/centific-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=10">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="app">
    <noscript>
      <main class="login-screen">
        <p>Turn on JavaScript to use the Daily Readiness Checklist.</p>
      </main>
    </noscript>
  </div>
  <script src="config.js"></script>
  <script type="module" src="js/app.js?v=10"></script>
</body>
</html>
